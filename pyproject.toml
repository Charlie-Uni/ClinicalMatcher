[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-matcher"
version = "0.1.0"
description = "Compliance-safe research pipeline for explainable patient-to-trial matching"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
authors = [{name = "Charlie-Uni"}]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
semantic-scan = [
  "numpy>=1.24,<3",
  "sentence-transformers==5.1.2",
]
dense = [
  "numpy==1.24.4",
  "torch==2.2.2",
  "transformers==4.43.0",
]

[project.scripts]
clinical-matcher-smoke = "clinical_matcher.cli:main"
clinical-matcher-validate = "clinical_matcher.validate_cli:main"
clinical-matcher-split = "clinical_matcher.split_cli:main"
clinical-matcher-check-split = "clinical_matcher.split_check_cli:main"
clinical-matcher-evaluate = "clinical_matcher.evaluate_cli:main"
clinical-matcher-import-trial = "clinical_matcher.import_trial_cli:main"
clinical-matcher-plan-capacity = "clinical_matcher.capacity_cli:main"
clinical-matcher-pilot = "clinical_matcher.pilot_cli:main"
clinical-matcher-snapshot = "clinical_matcher.snapshot_cli:main"
clinical-matcher-gold-readiness = "clinical_matcher.gold_readiness_cli:main"
clinical-matcher-audit-semantic-scan = "clinical_matcher.semantic_audit_cli:main"
clinical-matcher-regenerate-patients = "clinical_matcher.regenerate_patients_cli:main"
clinical-matcher-import-apixaban = "clinical_matcher.apixaban_cli:main"
clinical-matcher-validate-apixaban-contract = "clinical_matcher.apixaban_contract_cli:main"
clinical-matcher-apixaban-benchmark = "clinical_matcher.apixaban_benchmark_cli:main"
clinical-matcher-apixaban-quality = "clinical_matcher.apixaban_quality_cli:main"
clinical-matcher-apixaban-split = "clinical_matcher.apixaban_split_cli:main"
clinical-matcher-evaluate-apixaban = "clinical_matcher.apixaban_evaluate_cli:main"
clinical-matcher-apixaban-deterministic = "clinical_matcher.apixaban_deterministic_cli:main"
clinical-matcher-apixaban-structured-llm = "clinical_matcher.apixaban_structured_llm_cli:main"
clinical-matcher-apixaban-long-context = "clinical_matcher.apixaban_long_context_cli:main"
clinical-matcher-apixaban-evidence-index = "clinical_matcher.apixaban_evidence_index_cli:main"
clinical-matcher-apixaban-bm25 = "clinical_matcher.apixaban_bm25_cli:main"
clinical-matcher-apixaban-dense = "clinical_matcher.apixaban_dense_cli:main"
clinical-matcher-apixaban-rrf = "clinical_matcher.apixaban_rrf_cli:main"
clinical-matcher-apixaban-numeric-occurrence = "clinical_matcher.apixaban_numeric_occurrence_cli:main"
clinical-matcher-apixaban-neurosymbolic-audit = "clinical_matcher.apixaban_neurosymbolic_audit_cli:main"
clinical-matcher-apixaban-abstention = "clinical_matcher.apixaban_abstention_cli:main"
clinical-matcher-apixaban-error-attribution = "clinical_matcher.apixaban_error_attribution_cli:main"
clinical-matcher-reserve-apixaban-calibration = "clinical_matcher.apixaban_calibration_cli:main"
clinical-matcher-check-synthetic-upload = "clinical_matcher.synthetic_upload_cli:main"
clinical-matcher-export-apixaban-sft = "clinical_matcher.apixaban_sft_cli:main"
clinical-matcher-apixaban-sft-length = "clinical_matcher.apixaban_sft_length_cli:main"
clinical-matcher-apixaban-silver-audit = "clinical_matcher.apixaban_silver_audit_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clinical_matcher = ["schemas/*.json", "resources/*.json"]
